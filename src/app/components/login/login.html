<section class="mx-auto grid min-h-[calc(100vh-98px)] max-w-7xl items-center gap-8 px-5 py-8 lg:grid-cols-[1fr_420px]">
  <div>
    <p class="text-sm font-semibold uppercase tracking-wide text-teal-600">Employee Login</p>
    <h2 class="mt-3 max-w-2xl text-4xl font-bold sm:text-5xl">Raise, assign, and complete support tickets.</h2>
    <p class="mt-4 max-w-2xl text-base text-[var(--app-muted)]">
      Use your employee email and password to enter the ticket workspace.
    </p>
    <p class="mt-4 max-w-2xl text-base text-[var(--app-muted)]">
      Test Login Details: <br>Email:- admin@tickettool.local <br>
       Password:- Admin@123
   </p>
  </div>

  <form (ngSubmit)="login()" class="rounded-lg border border-[var(--app-border)] bg-[var(--app-surface)] p-6 shadow-sm">
    <h3 class="text-2xl font-bold">Sign in</h3>

    @if (error()) {
      <p class="mt-4 rounded-md border border-rose-200 bg-rose-50 px-3 py-2 text-sm font-semibold text-rose-800">
        {{ error() }}
      </p>
    }

    <label class="mt-5 block text-sm font-semibold">
      Email
      <input
        type="email"
        name="email"
        [ngModel]="email()"
        (ngModelChange)="email.set($event)"
        class="mt-2 w-full rounded-md border border-[var(--app-border)] bg-[var(--app-bg)] px-3 py-2.5 outline-none ring-teal-500 transition focus:ring-2"
      />
    </label>

    <label class="mt-4 block text-sm font-semibold">
      Password
      <input
        type="password"
        name="password"
        [ngModel]="password()"
        (ngModelChange)="password.set($event)"
        class="mt-2 w-full rounded-md border border-[var(--app-border)] bg-[var(--app-bg)] px-3 py-2.5 outline-none ring-teal-500 transition focus:ring-2"
      />
    </label>

    <button
      type="submit"
      [disabled]="isLoading()"
      class="mt-6 w-full rounded-md bg-teal-600 px-4 py-3 text-sm font-bold text-white shadow-sm transition hover:bg-teal-700 disabled:opacity-60"
    >
      {{ isLoading() ? 'Signing in...' : 'Login' }}
    </button>
  </form>
</section>
